<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 兔子洞 — Rabbit Hole</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e17;
  --bg2: #111827;
  --bg3: #1a2236;
  --bg4: #243049;
  --accent: #f59e0b;
  --accent2: #d97706;
  --green: #10b981;
  --red: #ef4444;
  --blue: #3b82f6;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --border: #374151;
}
body { font-family: 'SF Pro', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

/* ─── Layout ─── */
.app { display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 56px 1fr; height: 100vh; }
.topbar { grid-column: 1/-1; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
.sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
.main { display: flex; flex-direction: column; overflow: hidden; }
.rightpanel { background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; }

/* ─── Top Bar ─── */
.logo { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.logo span { color: var(--accent); }
.status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--green); }
.status .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.carrot-display { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--accent); background: var(--bg3); padding: 6px 14px; border-radius: 20px; }
.my-id { font-size: 12px; color: var(--text2); background: var(--bg3); padding: 4px 10px; border-radius: 12px; cursor: pointer; }
.my-id:hover { background: var(--bg4); }

/* ─── Sidebar ─── */
.sidebar-section { padding: 12px 16px; }
.sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text2); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.sidebar-title .count { background: var(--bg4); padding: 1px 8px; border-radius: 10px; font-size: 11px; }
.peer-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
.peer-item:hover { background: var(--bg3); }
.peer-item.active { background: var(--bg4); }
.peer-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.peer-info { flex: 1; min-width: 0; }
.peer-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peer-meta { font-size: 11px; color: var(--text2); }
.online-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; flex-shrink: 0; }

/* ─── Tab Bar ─── */
.tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
.tab { padding: 12px 20px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; color: var(--text2); }
.tab:hover { color: var(--text); background: var(--bg3); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── Chat Area ─── */
.chat-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; }
.chat-input:focus { border-color: var(--accent); }
.send-btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 14px; }
.send-btn:hover { background: var(--accent2); }

/* ─── Messages ─── */
.msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
.msg.mine { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
.msg.other { align-self: flex-start; background: var(--bg3); border-bottom-left-radius: 4px; }
.msg.system { align-self: center; background: transparent; color: var(--text2); font-size: 12px; padding: 4px 12px; }
.msg .sender { font-size: 11px; font-weight: 600; margin-bottom: 2px; opacity: 0.7; }
.msg .time { font-size: 10px; opacity: 0.5; margin-top: 4px; text-align: right; }

/* ─── Market ─── */
.market { padding: 16px; flex: 1; overflow-y: auto; }
.resource-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; transition: all 0.15s; }
.resource-card:hover { border-color: var(--accent); }
.resource-card.boosted { border-color: var(--accent); box-shadow: 0 0 12px rgba(245, 158, 11, 0.15); }
.resource-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.resource-meta { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.resource-actions { display: flex; gap: 8px; }
.btn-sm { padding: 5px 12px; border-radius: 6px; font-size: 12px; border: none; cursor: pointer; font-weight: 500; }
.btn-download { background: var(--green); color: #000; }
.btn-boost { background: var(--bg4); color: var(--accent); border: 1px solid var(--accent); }
.btn-boost:hover { background: var(--accent); color: #000; }

/* ─── Right Panel ─── */
.panel-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.panel-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 10px; }
.node-list { display: flex; flex-direction: column; gap: 6px; }
.node-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg3); border-radius: 6px; font-size: 12px; }
.node-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.stat-row .label { color: var(--text2); }
.stat-row .value { font-weight: 600; color: var(--accent); }

/* ─── Map Canvas ─── */
#nodeMap { width: 100%; height: 200px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }

/* ─── Upload Area ─── */
.upload-area { padding: 16px; border-bottom: 1px solid var(--border); }
.upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--bg3); border: 2px dashed var(--border); border-radius: 10px; color: var(--text2); cursor: pointer; font-size: 14px; transition: all 0.15s; }
.upload-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Welcome Overlay ─── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
.overlay.hidden { display: none; }
.welcome-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px; text-align: center; max-width: 420px; width: 90%; }
.welcome-card h1 { font-size: 28px; margin-bottom: 8px; }
.welcome-card h1 span { color: var(--accent); }
.welcome-card p { color: var(--text2); margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
.welcome-input { width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; text-align: center; outline: none; margin-bottom: 16px; }
.welcome-input:focus { border-color: var(--accent); }
.enter-btn { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
.enter-btn:hover { background: var(--accent2); }
.welcome-key { font-family: monospace; font-size: 11px; color: var(--text2); background: var(--bg); padding: 8px; border-radius: 6px; margin-top: 16px; word-break: break-all; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* ─── Notification toast ─── */
.toast { position: fixed; top: 70px; right: 20px; background: var(--bg3); border: 1px solid var(--accent); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 50; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<!-- Welcome Overlay -->
<div class="overlay" id="welcomeOverlay">
  <div class="welcome-card">
    <h1>🐰 <span>兔子洞</span></h1>
    <p>去中心化 P2P 通信网络<br>当现实世界的网络崩塌时，躲进这里，找到彼此</p>
    <input type="text" class="welcome-input" id="nicknameInput" placeholder="给自己取个名字..." maxlength="20" autofocus>

<!-- App -->
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="logo">🐰 <span>兔子洞</span></div>
    <div class="status"><div class="dot"></div> 已连接</div>

    <div id="tabChat" style="flex:1;display:flex;flex-direction:column;">

  <!-- Right Panel -->
  <div class="rightpanel">

      <div class="panel-title">🥕 胡萝卜经济</div>

      <div class="stat-row"><span class="label">贡献存储</span><span class="value" id="panelContrib">0 B</span></div>

        贡献带宽和存储赚取胡萝卜<br>竞价加速你的资源分发<br>中继消息也能赚取奖励

<script>
// ═══════════════════════════════════════════════════
// 🐰 Rabbit Hole Client
// ═══════════════════════════════════════════════════

const state = {
  myKeyPair: null,
  myPublicKey: '',
  myNickname: '',
  carrots: 100,
  contributions: 0,
  peers: new Map(),
  ws: null,
  dataChannels: new Map(), // peerKey -> RTCDataChannel
  pc: new Map(),           // peerKey -> RTCPeerConnection
  messageCount: 0,
  chunks: new Set(),
  selectedPeer: null
};

const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

// ─── Crypto ───
async function generateKeyPair() {
  const keyPair = await crypto.subtle.generateKey(
    { name: 'ECDSA', namedCurve: 'P-256' },
    true,
    ['sign', 'verify']
  );
  const pubRaw = await crypto.subtle.exportKey('raw', keyPair.publicKey);
  const pubHex = Array.from(new Uint8Array(pubRaw)).map(b => b.toString(16).padStart(2, '0')).join('');
  return { keyPair, publicKey: pubHex };
}

// ─── WebSocket Connection ───
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  state.ws = new WebSocket(`${protocol}//${location.host}`);

  state.ws.onopen = () => {
    log('🟢 已连接到信令服务器');
    state.ws.send(JSON.stringify({
      type: 'register',
      publicKey: state.myPublicKey,
      nickname: state.myNickname
    }));
  };

  state.ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleServerMessage(msg);
  };

  state.ws.onclose = () => {
    log('🔴 与服务器断开，3秒后重连...');
    setTimeout(connectWS, 3000);
  };
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'registered':
      state.carrots = msg.carrots;
      updateCarrotDisplay();
      msg.peers.forEach(p => {
        if (p.publicKey !== state.myPublicKey) {
          state.peers.set(p.publicKey, p);
        }
      });
      msg.resources.forEach(r => addResourceCard(r));
      renderPeerList();
      log('✅ 注册成功，公钥: ' + state.myPublicKey.slice(0, 12) + '...');
      // Try to connect to all existing peers via WebRTC
      setTimeout(() => {
        for (const pk of state.peers.keys()) {
          createPeerConnection(pk, true);
        }
      }, 500);
      break;

    case 'peer_joined':
      if (msg.peer.publicKey !== state.myPublicKey) {
        state.peers.set(msg.peer.publicKey, msg.peer);
        renderPeerList();
        log(`🕳️ ${msg.peer.nickname} 钻进了兔子洞`);
        // Initiate WebRTC connection to new peer
        createPeerConnection(msg.peer.publicKey, true);
      }
      break;

    case 'peer_left':
      state.peers.delete(msg.publicKey);
      closePeerConnection(msg.publicKey);
      renderPeerList();
      const leftPeer = state.peers.get(msg.publicKey);
      log(`🕳️ ${leftPeer?.nickname || msg.publicKey.slice(0,8)} 离开了兔子洞`);
      break;

    case 'peer_updated':
      if (state.peers.has(msg.publicKey)) {
        state.peers.get(msg.publicKey).nickname = msg.nickname;
        renderPeerList();
      }
      break;

    case 'offer':
      handleOffer(msg);
      break;
    case 'answer':
      handleAnswer(msg);
      break;
    case 'ice-candidate':
      handleIceCandidate(msg);
      break;

    case 'dm':
      addChatMessage(msg.fromName || msg.from.slice(0,8), msg.content, false, msg.timestamp);
      state.messageCount++;
      updateStats();
      break;

    case 'broadcast_msg':
      addChatMessage(msg.fromName || msg.from.slice(0,8), msg.content, false, msg.timestamp);
      state.messageCount++;
      updateStats();
      break;

    case 'carrot_update':
      state.carrots = msg.carrots;
      updateCarrotDisplay();
      log(`🥕 ${msg.reason}`);
      break;

    case 'new_resource':
      addResourceCard(msg.resource);
      log(`📦 新资源: ${msg.resource.name}`);
      break;

    case 'resource_boosted':
      log(`🔥 资源被竞价加速! +${msg.boostAmount}🥕`);
      break;

    case 'chunk_holders':
      // Update chunk node display
      break;
  }
}

// ─── WebRTC ───
function createPeerConnection(peerKey, isInitiator) {
  if (state.pc.has(peerKey)) return;
  if (peerKey === state.myPublicKey) return;

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  state.pc.set(peerKey, pc);

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      state.ws.send(JSON.stringify({
        type: 'ice-candidate',
        target: peerKey,
        candidate: e.candidate
      }));
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      log(`🔗 P2P 直连成功: ${state.peers.get(peerKey)?.nickname || peerKey.slice(0,8)}`);
    }
  };

  if (isInitiator) {
    const dc = pc.createDataChannel('rabbit-hole');
    setupDataChannel(dc, peerKey);
    pc.createOffer().then(offer => {
      pc.setLocalDescription(offer);
      state.ws.send(JSON.stringify({ type: 'offer', target: peerKey, sdp: offer }));
    });
  } else {
    pc.ondatachannel = (e) => {
      setupDataChannel(e.channel, peerKey);
    };
  }
}

function setupDataChannel(dc, peerKey) {
  dc.onopen = () => {
    state.dataChannels.set(peerKey, dc);
    log(`📡 数据通道已建立: ${state.peers.get(peerKey)?.nickname || peerKey.slice(0,8)}`);
  };
  dc.onclose = () => {
    state.dataChannels.delete(peerKey);
  };
  dc.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'dm') {
      addChatMessage(data.fromName, data.content, false, data.timestamp);
      state.messageCount++;
      updateStats();
    }
  };
}

async function handleOffer(msg) {
  createPeerConnection(msg.from, false);
  const pc = state.pc.get(msg.from);
  if (!pc) return;
  await pc.setRemoteDescription(msg.sdp);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  state.ws.send(JSON.stringify({ type: 'answer', target: msg.from, sdp: answer }));
}

async function handleAnswer(msg) {
  const pc = state.pc.get(msg.from);
  if (pc) await pc.setRemoteDescription(msg.sdp);
}

async function handleIceCandidate(msg) {
  const pc = state.pc.get(msg.from);
  if (pc) await pc.addIceCandidate(msg.candidate);
}

function closePeerConnection(peerKey) {
  const pc = state.pc.get(peerKey);
  if (pc) { pc.close(); state.pc.delete(peerKey); }
  state.dataChannels.delete(peerKey);
}

// ─── Send Messages ───
function sendMessage(content) {
  if (!content.trim()) return;

  // Try P2P first, fallback to server relay
  let sentViaP2P = false;
  for (const [peerKey, dc] of state.dataChannels) {
    if (dc.readyState === 'open') {
      dc.send(JSON.stringify({
        type: 'dm',
        from: state.myPublicKey,
        fromName: state.myNickname,
        content,
        timestamp: Date.now()
      }));
      sentViaP2P = true;
    }
  }

  // Also send via server (for peers without P2P)
  state.ws.send(JSON.stringify({
    type: 'broadcast_msg',
    content
  }));

  addChatMessage(state.myNickname, content, true, Date.now());
  state.messageCount++;
  updateStats();
}

// ─── File Upload & Chunking ───
async function handleFileUpload(files) {
  for (const file of files) {
    const resourceId = crypto.randomUUID();
    const CHUNK_SIZE = 64 * 1024; // 64KB chunks
    const chunks = [];
    const buffer = await file.arrayBuffer();
    const totalChunks = Math.ceil(buffer.byteLength / CHUNK_SIZE);

    log(`📦 正在分片: ${file.name} (${totalChunks} 片)`);

    for (let i = 0; i < totalChunks; i++) {
      const start = i * CHUNK_SIZE;
      const end = Math.min(start + CHUNK_SIZE, buffer.byteLength);
      const chunk = buffer.slice(start, end);

      // Hash the chunk
      const hashBuffer = await crypto.subtle.digest('SHA-256', chunk);
      const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

      chunks.push({
        index: i,
        hash: hashHex,
        size: chunk.byteLength,
        data: Array.from(new Uint8Array(chunk))
      });

      // Register chunk with server
      state.ws.send(JSON.stringify({
        type: 'announce_chunk',
        chunkHash: hashHex,
        size: chunk.byteLength
      }));

      state.chunks.add(hashHex);
      state.contributions += chunk.byteLength;
    }

    // Publish resource
    state.ws.send(JSON.stringify({
      type: 'publish_resource',
      resourceId,
      name: file.name,
      size: file.size,
      chunks: chunks.map(c => ({ index: c.index, hash: c.hash, size: c.size }))
    }));

    // Store locally for download
    localStorage.setItem(`rh_resource_${resourceId}`, JSON.stringify({
      name: file.name,
      size: file.size,
      chunks
    }));

    updateStats();
    log(`✅ ${file.name} 上传完成 (${totalChunks} 片已分布存储)`);
  }
}

// ─── UI: Render ───
function renderPeerList() {
  const el = document.getElementById('peerList');
  const colors = ['#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316'];
  let html = '';

  for (const [pk, peer] of state.peers) {
    const color = colors[pk.charCodeAt(0) % colors.length];
    const initial = (peer.nickname || '?')[0].toUpperCase();
    html += `
      <div class="peer-item ${state.selectedPeer === pk ? 'active' : ''}" onclick="selectPeer('${pk}')">
        <div class="peer-avatar" style="background:${color}20;color:${color};">${initial}</div>
        <div class="peer-info">
          <div class="peer-name">${escapeHtml(peer.nickname)}</div>
          <div class="peer-meta">🥕 ${peer.carrots} · ${formatTime(peer.joinedAt)}</div>
        </div>
        <div class="online-dot"></div>
      </div>`;
  }

  el.innerHTML = html || '<div style="font-size:12px;color:var(--text2);padding:8px;">等待其他兔子加入...</div>';
  document.getElementById('peerCount').textContent = state.peers.size;
  updateStats();
}

function selectPeer(pk) {
  state.selectedPeer = state.selectedPeer === pk ? null : pk;
  renderPeerList();
}

function addChatMessage(sender, content, isMine, timestamp) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `msg ${isMine ? 'mine' : 'other'}`;
  div.innerHTML = `${!isMine ? `<div class="sender">${escapeHtml(sender)}</div>` : ''}
    <div>${escapeHtml(content)}</div>
    <div class="time">${formatTime(timestamp)}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addResourceCard(resource) {
  const list = document.getElementById('marketList');
  if (list.querySelector('.msg.system')) list.innerHTML = '';

  const div = document.createElement('div');
  div.className = `resource-card ${resource.boosted ? 'boosted' : ''}`;
  div.id = `res_${resource.id}`;
  div.innerHTML = `
    <div class="resource-name">📄 ${escapeHtml(resource.name)}</div>
    <div class="resource-meta">
      ${formatSize(resource.size)} · ${resource.chunks?.length || '?'} 片 ·
      发布者: ${escapeHtml(resource.publisherName || '匿名')} ·
      ${resource.boosted ? '🔥 已竞价加速' : '普通'}
    </div>
    <div class="resource-actions">
      <button class="btn-sm btn-download" onclick="downloadResource('${resource.id}')">⬇ 下载</button>
      <button class="btn-sm btn-boost" onclick="boostResource('${resource.id}')">🥕 竞价加速</button>
    </div>`;
  list.prepend(div);
}

async function downloadResource(resourceId) {
  const data = localStorage.getItem(`rh_resource_${resourceId}`);
  if (data) {
    const resource = JSON.parse(data);
    // Reassemble chunks
    const buffers = resource.chunks
      .sort((a, b) => a.index - b.index)
      .map(c => new Uint8Array(c.data));
    const blob = new Blob(buffers);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = resource.name;
    a.click();
    URL.revokeObjectURL(url);
    log(`⬇ 下载完成: ${resource.name}`);
  } else {
    toast('资源碎片需要从其他节点获取...');
  }
}

function boostResource(resourceId) {
  const amount = parseInt(prompt('投入多少胡萝卜竞价？', '10'));
  if (amount && amount > 0 && amount <= state.carrots) {
    state.ws.send(JSON.stringify({
      type: 'boost_resource',
      resourceId,
      amount
    }));
  }
}

// ─── UI: Tabs ───
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tabChat').style.display = tab === 'chat' ? 'flex' : 'none';
  document.getElementById('tabMarket').style.display = tab === 'market' ? 'flex' : 'none';
  document.getElementById('tabMap').style.display = tab === 'map' ? 'flex' : 'none';
  if (tab === 'map') drawMap();
}

// ─── Node Map ───
function drawMap() {
  const canvas = document.getElementById('nodeMap');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * 2;
  canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;

  ctx.fillStyle = '#0a0e17';
  ctx.fillRect(0, 0, w, h);

  const nodes = [{ pk: state.myPublicKey, nick: state.myNickname, isMe: true }];
  for (const [pk, peer] of state.peers) {
    nodes.push({ pk, nick: peer.nickname, isMe: false });
  }

  // Position nodes in a circle
  const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.35;
  const positions = nodes.map((n, i) => {
    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;
    return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r, ...n };
  });

  // Draw connections
  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 1;
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      ctx.beginPath();
      ctx.moveTo(positions[i].x, positions[i].y);
      ctx.lineTo(positions[j].x, positions[j].y);
      ctx.stroke();
    }
  }

  // Draw P2P connections
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 2;
  for (const [pk] of state.dataChannels) {
    const me = positions.find(p => p.isMe);
    const them = positions.find(p => p.pk === pk);
    if (me && them) {
      ctx.beginPath();
      ctx.moveTo(me.x, me.y);
      ctx.lineTo(them.x, them.y);
      ctx.stroke();
    }
  }

  // Draw nodes
  positions.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.isMe ? 10 : 7, 0, Math.PI * 2);
    ctx.fillStyle = p.isMe ? '#f59e0b' : '#10b981';
    ctx.fill();
    ctx.fillStyle = '#e5e7eb';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.nick.slice(0, 6), p.x, p.y + 20);
  });
}

// ─── Utils ───
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function updateCarrotDisplay() {
  document.getElementById('carrotCount').textContent = state.carrots;
  document.getElementById('panelCarrots').textContent = state.carrots;
}

function updateStats() {
  document.getElementById('statNodes').textContent = state.peers.size + 1;
  document.getElementById('statMsgs').textContent = state.messageCount;
  document.getElementById('statChunks').textContent = state.chunks.size;
  const contrib = formatSize(state.contributions);
  document.getElementById('statContrib').textContent = contrib;
  document.getElementById('panelContrib').textContent = contrib;
}

function log(text) {
  const el = document.getElementById('activityLog');
  const div = document.createElement('div');
  div.textContent = `[${new Date().toLocaleTimeString('zh-CN')}] ${text}`;
  el.prepend(div);
  if (el.children.length > 50) el.removeChild(el.lastChild);
}

function toast(text) {
  const div = document.createElement('div');
  div.className = 'toast';
  div.textContent = text;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}

// ─── Init ───
document.addEventListener('DOMContentLoaded', async () => {
  // Generate key pair
  state.myKeyPair = await generateKeyPair();
  state.myPublicKey = state.myKeyPair.publicKey;

  document.getElementById('keyInfo').textContent = `公钥: ${state.myPublicKey.slice(0, 24)}...`;
  document.getElementById('keyInfo').style.display = 'block';

  // Enter button
  document.getElementById('enterBtn').addEventListener('click', () => {
    const nick = document.getElementById('nicknameInput').value.trim() || `兔子${Math.floor(Math.random()*999)}`;
    state.myNickname = nick;
    document.getElementById('welcomeOverlay').classList.add('hidden');
    document.getElementById('myId').textContent = nick;
    document.getElementById('myPubKey').textContent = state.myPublicKey;
    connectWS();
  });

  document.getElementById('nicknameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('enterBtn').click();
  });

  // Chat
  document.getElementById('sendBtn').addEventListener('click', () => {
    const input = document.getElementById('chatInput');
    sendMessage(input.value);
    input.value = '';
    input.focus();
  });
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const input = document.getElementById('chatInput');
      sendMessage(input.value);
      input.value = '';
    }
  });

  // File upload
  document.getElementById('fileInput').addEventListener('change', (e) => {
    handleFileUpload(e.target.files);
  });

  // Copy public key
  document.getElementById('myId').addEventListener('click', () => {
    navigator.clipboard?.writeText(state.myPublicKey);
    toast('公钥已复制');
  });

  // Auto-resize map
  window.addEventListener('resize', () => {
    if (document.getElementById('tabMap').style.display !== 'none') drawMap();
  });
});
</script>
